# Local Kind monitoring configuration for the Capstone project.

grafana:
  enabled: true
  admin:
    existingSecret: kube-prometheus-stack-grafana
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
  service:
    type: ClusterIP
  defaultDashboardsEnabled: true

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 3d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 64Mi

# These control-plane endpoints are commonly inaccessible to Prometheus
# from a local Kind cluster; application, API-server, kubelet and node
# metrics remain enabled.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# Required custom alert: more than three container restarts in five minutes.
additionalPrometheusRulesMap:
  capstone-pod-restart-alert:
    groups:
      - name: capstone.pod-health
        rules:
          - alert: PodRestartingTooOften
            expr: increase(kube_pod_container_status_restarts_total{namespace=~"staging|production"}[5m]) > 3
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "A container restarted more than three times in five minutes"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted more than three times in five minutes."
