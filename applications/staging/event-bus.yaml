apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: event-bus-staging
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Akshatshar2204/k8s-gitops-platform.git
    targetRevision: main
    path: helm/event-bus

    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
